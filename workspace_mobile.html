<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Workspace"/>
<title>Workspace</title>
<style>
:root{
  --bg:#161b28;--surf:#1e2536;--surf2:#252d40;
  --brd:rgba(255,255,255,.07);--brd2:rgba(255,255,255,.15);
  --tx:#dce3f0;--tx2:#5a6580;--tx3:#3a4560;
  --done:#1D9E75;--high:#F0997B;--mid:#FAC775;--low:#5DCAA5;
  --note:#141928;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;background:var(--bg);}
body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,sans-serif;display:flex;flex-direction:column;overflow:hidden;position:fixed;width:100%;}

/* topbar */
.tb{padding:calc(var(--st) + 14px) 16px 10px;background:var(--bg);border-bottom:.5px solid var(--brd);flex-shrink:0;}
.tb-r1{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.tb-title{font-size:20px;font-weight:700;letter-spacing:-.4px;}
.tb-add{background:var(--surf2);border:.5px solid var(--brd2);border-radius:18px;color:var(--tx2);font-size:13px;padding:5px 13px;font-family:inherit;-webkit-appearance:none;}
.tb-r2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:16px;}
.pill-u{background:rgba(216,90,48,.2);color:var(--high);}
.pill-t{background:rgba(55,138,221,.2);color:#85B7EB;}
.pill-d{background:rgba(29,158,117,.2);color:var(--low);}
.sync{font-size:10px;margin-left:auto;color:var(--tx3);}

/* scroll area — chiave per iPhone */
.page{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  padding:12px 12px calc(var(--sb) + 100px);
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:0;
}

/* card */
.card{background:var(--surf);border-radius:14px;overflow:hidden;border:.5px solid var(--brd);}
.card-top{height:3px;}
.card-hdr{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;}
.card-ico{font-size:20px;flex-shrink:0;}
.card-nm{flex:1;font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-cnt{font-size:11px;color:var(--tx3);background:rgba(255,255,255,.05);padding:2px 6px;border-radius:8px;}
.card-ed{font-size:14px;color:var(--tx3);padding:4px 6px;}
.card-dl{font-size:13px;color:rgba(240,153,123,.3);padding:4px 6px;}
.prog{height:2px;background:rgba(255,255,255,.05);margin:0 12px 5px;border-radius:2px;overflow:hidden;}
.prog-f{height:100%;border-radius:2px;transition:width .3s;}
.hdiv{height:.5px;background:var(--brd);margin-bottom:3px;}

/* tasks */
.tlist{padding:0 4px;}
.tw{margin-bottom:2px;}
.tr{display:flex;align-items:center;gap:8px;padding:11px 8px;min-height:48px;background:var(--surf);border-radius:8px;}
.cb{width:22px;height:22px;border-radius:6px;border:1.5px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cb.done{background:var(--done);border-color:var(--done);}
.cb.done::after{content:'✓';color:#fff;font-size:13px;font-weight:700;}
.tn{flex:1;font-size:14px;color:#9aaac8;line-height:1.3;word-break:break-word;}
.tn.done{color:var(--tx3);text-decoration:line-through;}
.tctrl{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.ic{font-size:17px;padding:3px;line-height:1;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dlt{font-size:11px;color:rgba(240,153,123,.3);padding:3px 5px;}

/* note */
.note-a{background:var(--note);padding:6px 12px 8px 38px;display:none;}
.note-a.open{display:block;}
.note-ta{width:100%;background:transparent;border:none;color:#7aaabb;font-size:13px;font-family:inherit;resize:none;outline:none;line-height:1.5;min-height:40px;}
.note-ta::placeholder{color:var(--tx3);}

/* add task row */
.add-r{display:flex;align-items:center;gap:6px;padding:8px 10px 12px;}
.add-i{
  flex:1;background:rgba(255,255,255,.05);
  border:.5px solid var(--brd2);border-radius:10px;
  padding:10px 12px;color:var(--tx);font-size:15px;
  -webkit-appearance:none;outline:none;font-family:inherit;
  /* importante su iOS */
  -webkit-user-select:text;user-select:text;
}
.add-i::placeholder{color:var(--tx3);}
.add-btn2{
  background:var(--surf2);border:.5px solid var(--brd2);
  border-radius:10px;color:var(--tx2);font-size:20px;
  width:42px;height:42px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;font-family:inherit;
  -webkit-appearance:none;
}

/* modal */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:flex-end;justify-content:center;}
.ov.open{display:flex;}
.sh{background:var(--surf);border-radius:20px 20px 0 0;padding:18px 18px calc(var(--sb) + 18px);width:100%;max-width:480px;}
.sh-t{font-size:14px;font-weight:600;color:var(--tx2);margin-bottom:10px;text-align:center;}
.sh-i{width:100%;background:var(--surf2);border:1px solid var(--brd2);border-radius:10px;padding:12px 14px;color:var(--tx);font-size:16px;-webkit-appearance:none;outline:none;margin-bottom:10px;font-family:inherit;}
.sh-bs{display:flex;gap:8px;}
.sb{flex:1;padding:12px;border-radius:12px;font-size:15px;font-weight:600;border:none;font-family:inherit;-webkit-appearance:none;}
.sb-c{background:var(--surf2);color:var(--tx2);}
.sb-ok{background:#378ADD;color:#fff;}

.spin-wrap{display:flex;align-items:center;justify-content:center;padding:60px 0;flex-direction:column;gap:10px;color:var(--tx2);}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.1);border-top-color:#378ADD;border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="tb">
  <div class="tb-r1">
    <span class="tb-title">Workspace</span>
    <button class="tb-add" onclick="addFolder()">+ cartella</button>
  </div>
  <div class="tb-r2">
    <span class="pill pill-u" id="su">0 urgenti</span>
    <span class="pill pill-t" id="st">0 da fare</span>
    <span class="pill pill-d" id="sd">0 fatti</span>
    <span class="sync" id="sync">☁ …</span>
  </div>
</div>

<div class="page" id="page">
  <div class="spin-wrap" id="loading"><div class="spin"></div><span>Caricamento…</span></div>
</div>

<div class="ov" id="modal" onclick="closeModal(event)">
  <div class="sh">
    <div class="sh-t">Rinomina cartella</div>
    <input class="sh-i" id="mi" type="text"/>
    <div class="sh-bs">
      <button class="sb sb-c" onclick="closeModalDirect()">Annulla</button>
      <button class="sb sb-ok" onclick="confirmRename()">Salva</button>
    </div>
  </div>
</div>

<script>
const FB  = "https://to-do-list-45e28-default-rtdb.europe-west1.firebasedatabase.app";
const ACS = ['blue','purple','teal','amber','coral'];
const ICS = ['💼','📊','⚙️','📅','🔥','📁','🗂','📌','🧩','📋','🏦'];
const PRC = ['high','mid','low'];
const PRL = {high:'#F0997B',mid:'#FAC775',low:'#5DCAA5'};
const ACL = {blue:'#378ADD',purple:'#7F77DD',teal:'#1D9E75',amber:'#BA7517',coral:'#D85A30'};

let S={folders:[]}, NID=9000, RID=null;

/* ── Firebase ── */
async function fbR(){
  const r=await fetch(`${FB}/workspace.json`);
  if(!r.ok) throw r.status;
  const w=await r.json();
  return(w&&w.payload)?JSON.parse(w.payload):null;
}
async function fbW(d){
  const r=await fetch(`${FB}/workspace.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({payload:JSON.stringify(d)})});
  if(!r.ok) throw r.status;
}
function ss(s){
  const e=document.getElementById('sync');
  if(s==='ok'){e.textContent='☁ ok';e.style.color='#1D9E75';}
  else if(s==='err'){e.textContent='☁ errore';e.style.color='#F0997B';}
  else{e.textContent='☁ …';e.style.color='#5a6580';}
}
async function save(){
  ss('wait');
  try{await fbW(S);ss('ok');}catch(e){ss('err');}
}

/* ── Init ── */
async function init(){
  ss('wait');
  try{
    const d=await fbR();
    if(d&&d.folders){
      d.folders.forEach(f=>f.tasks.forEach(t=>{t.urgent=t.urgent??false;t.note=t.note??'';}));
      S=d;
    }
    ss('ok');
  }catch(e){ss('err');}
  const ids=S.folders.flatMap(f=>[f.id,...f.tasks.map(t=>t.id)]);
  NID=Math.max(9000,...ids)+1;
  const l=document.getElementById('loading');
  if(l) l.remove();
  render();
}

/* ── Stats ── */
function stats(){
  let u=0,t=0,d=0;
  S.folders.forEach(f=>f.tasks.forEach(k=>{
    if(k.done)d++;else if(k.urgent||k.priority==='high')u++;else t++;
  }));
  document.getElementById('su').textContent=u+' urgenti';
  document.getElementById('st').textContent=t+' da fare';
  document.getElementById('sd').textContent=d+' fatti';
}

/* ── Render ── */
function render(){
  const pg=document.getElementById('page');
  pg.innerHTML='';
  S.folders.forEach(f=>pg.appendChild(mkCard(f)));
  stats();
}

function mkCard(f){
  const ac=ACL[f.accent]||ACL.blue;
  const dn=f.tasks.filter(t=>t.done).length, tot=f.tasks.length;
  const pct=tot?(dn/tot*100).toFixed(1):0;
  const c=document.createElement('div');
  c.className='card'; c.dataset.fid=f.id;
  c.innerHTML=`
    <div class="card-top" style="background:${ac}"></div>
    <div class="card-hdr">
      <span class="card-ico">${H(f.icon)}</span>
      <span class="card-nm">${H(f.name)}</span>
      <span class="card-cnt">${dn}/${tot}</span>
      <span class="card-ed" onclick="openRename(${f.id})">✎</span>
      <span class="card-dl" onclick="delFolder(${f.id})">✕</span>
    </div>
    <div class="prog"><div class="prog-f" style="width:${pct}%;background:${ac}"></div></div>
    <div class="hdiv"></div>
    <div class="tlist" id="tl-${f.id}"></div>
    <div class="add-r">
      <input class="add-i" id="ai-${f.id}" type="text" placeholder="+ nuovo task…" enterkeyhint="done"/>
      <button class="add-btn2" onclick="addTask(${f.id})">↵</button>
    </div>`;
  // bind input enter
  const inp=c.querySelector(`#ai-${f.id}`);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addTask(f.id);}});
  inp.addEventListener('keyup',e=>{if(e.key==='Enter'){e.preventDefault();}});
  mkTasks(f,c);
  return c;
}

function mkTasks(f,card){
  const tl=card.querySelector(`#tl-${f.id}`);
  tl.innerHTML='';
  f.tasks.forEach(t=>tl.appendChild(mkTask(t,f)));
}

function mkTask(t,f){
  const w=document.createElement('div'); w.className='tw'; w.dataset.tid=t.id;
  const hn=!!(t.note&&t.note.trim());
  w.innerHTML=`
    <div class="tr">
      <div class="cb ${t.done?'done':''}" onclick="tDone(${f.id},${t.id})"></div>
      <span class="tn ${t.done?'done':''}">${H(t.name)}</span>
      <div class="tctrl">
        <span class="ic" onclick="tNote(${f.id},${t.id})" style="opacity:${hn?1:.3};filter:${hn?'none':'grayscale(1)'}">📝</span>
        <span class="ic" onclick="tUrg(${f.id},${t.id})" style="opacity:${t.urgent?1:.25};filter:${t.urgent?'none':'grayscale(1)'}">🔥</span>
        <div class="dot" style="background:${PRL[t.priority]}" onclick="tPrio(${f.id},${t.id})"></div>
        <span class="dlt" onclick="tDel(${f.id},${t.id})">✕</span>
      </div>
    </div>
    <div class="note-a ${hn?'open':''}" id="na-${f.id}-${t.id}">
      <textarea class="note-ta" placeholder="Nota…" oninput="tSaveNote(${f.id},${t.id},this.value)">${H(t.note||'')}</textarea>
    </div>`;
  return w;
}

/* ── Actions ── */
function uid(){return ++NID;}
function gF(id){return S.folders.find(f=>f.id===id);}
function gT(fid,tid){const f=gF(fid);return f?f.tasks.find(t=>t.id===tid):null;}

function tDone(fid,tid){const t=gT(fid,tid);if(!t)return;t.done=!t.done;save();rc(fid);stats();}
function tUrg(fid,tid){const t=gT(fid,tid);if(!t)return;t.urgent=!t.urgent;save();rc(fid);stats();}
function tPrio(fid,tid){const t=gT(fid,tid);if(!t)return;t.priority=PRC[(PRC.indexOf(t.priority)+1)%3];save();rc(fid);stats();}
function tDel(fid,tid){const f=gF(fid);if(!f)return;f.tasks=f.tasks.filter(t=>t.id!==tid);save();rc(fid);stats();}
function tNote(fid,tid){
  const a=document.getElementById(`na-${fid}-${tid}`);if(!a)return;
  a.classList.toggle('open');
  if(a.classList.contains('open'))setTimeout(()=>a.querySelector('textarea').focus(),50);
}
function tSaveNote(fid,tid,val){
  const t=gT(fid,tid);if(!t)return;t.note=val.trim();save();
  const w=document.querySelector(`.tw[data-tid="${tid}"]`);
  if(w){const b=w.querySelector('.ic');if(b){b.style.opacity=t.note?'1':'0.3';b.style.filter=t.note?'none':'grayscale(1)';}}
}
function addTask(fid){
  const inp=document.getElementById(`ai-${fid}`);
  const name=inp.value.trim();if(!name)return;
  const f=gF(fid);if(!f)return;
  f.tasks.push({id:uid(),name,done:false,priority:'mid',urgent:false,note:''});
  inp.value='';inp.blur();
  save();rc(fid);stats();
}
function addFolder(){
  const ac=ACS[S.folders.length%ACS.length];
  S.folders.push({id:uid(),name:'Nuova cartella',icon:'📁',accent:ac,tasks:[]});
  save();render();openRename(S.folders[S.folders.length-1].id);
}
function delFolder(fid){
  const f=gF(fid);if(!f)return;
  if(f.tasks.length>0&&!confirm(`Eliminare "${f.name}"?`))return;
  S.folders=S.folders.filter(x=>x.id!==fid);save();render();
}
function openRename(fid){
  RID=fid;const f=gF(fid);if(!f)return;
  document.getElementById('mi').value=f.name;
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('mi').focus(),150);
}
function confirmRename(){
  const val=document.getElementById('mi').value.trim();
  if(val&&RID){
    const f=gF(RID);
    if(f){f.name=val;save();const c=document.querySelector(`.card[data-fid="${RID}"]`);if(c)c.querySelector('.card-nm').textContent=val;}
  }
  closeModalDirect();
}
function closeModal(e){if(e.target.id==='modal')closeModalDirect();}
function closeModalDirect(){document.getElementById('modal').classList.remove('open');RID=null;}
document.getElementById('mi').addEventListener('keydown',e=>{if(e.key==='Enter')confirmRename();});

function rc(fid){
  const f=gF(fid);if(!f)return;
  const old=document.querySelector(`.card[data-fid="${fid}"]`);if(!old)return;
  old.replaceWith(mkCard(f));
}
function H(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

init();
</script>
</body>
</html>
